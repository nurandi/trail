<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Canonical Redirect -->
    <script>
        if (window.location.pathname.endsWith('/index.html')) {
            window.location.replace(window.location.href.replace('/index.html', '/'));
        }
    </script>
    <!-- Google Analytics -->
    <script src="analytics.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Curated trail running routes and GPX downloads. Arsip rute trail running pilihan di berbagai lokasi untuk referensi eksplorasi dan latihan.">
    <title>The Trail Archive</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛰️</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=1.6">
</head>

<body>
    <header>
        <div class="container">
            <div class="logo-wrapper">
                <img id="athlete-avatar" src="" alt="" style="display: none;">
            </div>
            <h1>The Trail Archive</h1>
            <p>Curated trail running routes and GPX downloads.</p>
            <p class="last-update">Last updated: <span id="last-update">Calculating...</span></p>
            <p class="header-links">
                <a href="help.html" class="help-link"><i class="fas fa-question-circle"></i> Help Guide</a>
            </p>
        </div>
    </header>

    <main class="container">
        <div class="filters-header">
            <button id="toggleFilters" class="btn-toggle">
                <i class="fas fa-sliders-h icon"></i>
                <span class="text">Show Filters</span>
                <i class="fas fa-chevron-down arrow"></i>
            </button>
        </div>

        <div id="filtersWrapper" class="filters-wrapper collapsed">
            <div class="controls-bar">
                <div class="control-group search-group">
                    <label for="searchQuery">Search</label>
                    <input type="text" id="searchQuery" placeholder="Activity, location, or POI..." autocomplete="off">
                </div>

                <div class="control-group">
                    <label for="filterDistance">Distance</label>
                    <select id="filterDistance">
                        <option value="all">All</option>
                        <option value="0-10">&lt; 10 km</option>
                        <option value="10-20">10 - 20 km</option>
                        <option value="20-30">20 - 30 km</option>
                        <option value="30-40">30 - 40 km</option>
                        <option value="40+">&gt; 40 km</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="filterElevation">Elevation</label>
                    <select id="filterElevation">
                        <option value="all">All</option>
                        <option value="0-500">&lt; 500 m</option>
                        <option value="500-1000">500 - 1000 m</option>
                        <option value="1000-2000">1000 - 2000 m</option>
                        <option value="2000-3000">2000 - 3000 m</option>
                        <option value="3000+">&gt; 3000 m</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="filterEffort">Effort</label>
                    <select id="filterEffort">
                        <option value="all">All</option>
                        <option value="0-25">&lt; 25 km</option>
                        <option value="25-45">25 - 45 km</option>
                        <option value="45-75">45 - 75 km</option>
                        <option value="75-115">75 - 115 km</option>
                        <option value="115-155">115 - 155 km</option>
                        <option value="155-210">155 - 210 km</option>
                        <option value="210+">&gt; 210 km</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="filterType">Activity Type</label>
                    <select id="filterType">
                        <option value="all">All</option>
                        <option value="race">Race Only</option>
                        <option value="training">Training Only</option>
                        <option value="route">Route Only</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="filterRecency">Recency</label>
                    <select id="filterRecency">
                        <option value="all">Any Time</option>
                        <option value="week">&lt; 1 Week</option>
                        <option value="month">&lt; 1 Month</option>
                        <option value="year">&lt; 1 Year</option>
                        <option value="legacy">&gt; 1 Year</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="sortBy">Sort By</label>
                    <select id="sortBy">
                        <option value="date-desc">Newest First</option>
                        <option value="date-asc">Oldest First</option>
                        <option value="effort-desc">Effort (High-Low)</option>
                        <option value="effort-asc">Effort (Low-High)</option>
                        <option value="dist-desc">Distance (High-Low)</option>
                        <option value="dist-asc">Distance (Low-High)</option>
                        <option value="elev-desc">Elevation (High-Low)</option>
                        <option value="elev-asc">Elevation (Low-High)</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="routes-grid" class="routes-grid">
            <!-- Route cards will be dynamically inserted here -->
            <div class="loading">Loading routes...</div>
        </div>

        <div id="pagination" class="pagination"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 The Trail Archive. All rights reserved.</p>
            <p>Data provided by Strava | <a href="#" id="aboutLink">About & Terms</a></p>
        </div>
    </footer>

    <!-- TOC Modal -->
    <div id="tocModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Terms of Use</h2>

            <div id="oldRouteWarning" class="alert-warning" style="display: none;"></div>

            <div id="tosContent" class="toc-text">
                <!-- Loaded from legal.json -->
            </div>
            <div class="toc-agreement">
                <input type="checkbox" id="tocCheckbox">
                <label for="tocCheckbox">I have read and agree to the Terms of Use</label>
            </div>
            <div class="modal-actions">
                <button id="cancelBtn" class="btn">Cancel</button>
                <button id="confirmDownloadBtn" class="btn btn-primary" disabled>Download GPX</button>
            </div>
        </div>
    </div>

    <!-- About Modal -->
    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeAbout">&times;</span>
            <h2>About & Terms</h2>
            <div id="aboutContent" class="toc-text">
                <!-- Loaded from legal.json -->
            </div>
            <div class="modal-actions">
                <button id="closeAboutBtn" class="btn btn-primary">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.6"></script>
</body>

</html>
